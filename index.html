<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Candidus Gestão Financeira</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="brand"><div class="mark">C</div><div class="name">Candidus</div></div>
    <p class="sub">Gestão Financeira · BPO · Controladoria</p>
    <div id="loginMsg"></div>
    <form id="loginForm">
      <div class="field"><label>E-mail</label>
        <input type="email" id="email" placeholder="voce@empresa.com" required></div>
      <div class="field"><label>Senha</label>
        <input type="password" id="password" placeholder="••••••••" required></div>
      <button class="btn full" type="submit" id="loginBtn">Entrar</button>
    </form>
  </div>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <button class="burger" id="burger" title="Recolher menu">☰</button>
    <div class="mark">C</div><div class="name">Candidus</div>
    <div class="company-pick">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1m4 0h1M9 13h1m4 0h1M9 17h1m4 0h1"/></svg>
      <select id="companySel"></select>
    </div>
    <div class="spacer"></div>
    <div class="user"><span class="email" id="userEmail"></span>
      <button class="out" id="logout">Sair</button></div>
  </div>
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script src="./config.js"></script>
<script src="./core.js"></script>
<script src="./dashboard.js"></script>
<script src="./contas-receber.js"></script>
<script src="./contas-a-pargar.js"></script>
<script src="./cadastro.js"></script>
<script src="./fluxo-caixa.js"></script>
<script src="./pedencias.js"></script>
<script src="./tarefas.js"></script>
<script src="./documentos.js"></script>
<script src="./dre.js"></script>
<script src="./orcamento.js"></script>
<script src="./realizado-orcado.js"></script>
<script src="./indicadores.js"></script>
<script src="./main.js"></script>
</body>
</html>
